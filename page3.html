<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Installing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px;max-width:380px;width:100%;text-align:center;box-shadow:0 2px 20px rgba(0,0,0,0.08)}
.sp{width:48px;height:48px;margin:0 auto 16px;border:3px solid #e0e0e0;border-top:3px solid #1976d2;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
h2{font-size:20px;color:#1a1a1a;margin-bottom:6px}
p{font-size:14px;color:#666;margin-bottom:20px}
.pc{background:#f0f7ff;border-radius:8px;padding:14px;margin-bottom:12px}
.pt{font-size:12px;color:#1976d2;margin-bottom:6px}
.pb{height:3px;background:#e0e0e0;border-radius:2px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,#1976d2,#42a5f5);width:0%;transition:width 0.8s}
.steps{text-align:left;margin-top:10px}
.step{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;color:#888}
.step.active{color:#1976d2;font-weight:500}
.step.done{color:#4caf50}
.si{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.step.done .si{background:#4caf50;border-color:#4caf50;color:#fff}
</style>
</head>
<body>
<div class="card">
<div class="sp"></div>
<h2>Installing Update...</h2>
<p>Don't turn off your device.</p>
<div class="pc">
<div class="pt" id="st">Preparing installation...</div>
<div class="pb"><div class="pf" id="pf"></div></div>
</div>
<div class="steps">
<div class="step active" id="s1"><div class="si">✓</div>Verifying package</div>
<div class="step" id="s2"><div class="si">2</div>Extracting files</div>
<div class="step" id="s3"><div class="si">3</div>Installing</div>
<div class="step" id="s4"><div class="si">4</div>Applying patches</div>
</div>
</div>
<script>
var steps=['s1','s2','s3','s4'];
var texts=['Verifying package...','Extracting files...','Installing...','Applying patches...'];
var cur=0;
function next(){
if(cur<steps.length){
document.getElementById(steps[cur]).className='step done';
document.getElementById('st').textContent=texts[cur];
document.getElementById('pf').style.width=((cur+1)*25)+'%';
cur++;
if(cur<steps.length) document.getElementById(steps[cur]).className='step active';
if(cur<steps.length) setTimeout(next,2000);
else document.getElementById('st').textContent='Update installed!';
}
}
setTimeout(next,1500);
</script>
</body>
</html>
